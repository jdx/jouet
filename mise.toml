# mise.lock is lockfile revision 3 (forge repository IDs), which mise reads
# from 2026.9.16.
min_version = "2026.9.16"

# bats and its helpers are git submodules under test/, pinned so a checkout runs
# the same test runner as CI. `git submodule update --init --recursive` once.
[env]
_.path = ["test/bats/bin"]

[tools]
# aube installs the documentation site's dependencies from docs/aube-lock.yaml.
aube = { version = "latest", lazy = true, lazy_bins = ["aube"], minimum_release_age = "0s" }
# hk.pkl amends a pinned hk package; the tool itself floats and is resolved by mise.lock.
hk = { version = "latest", minimum_release_age = "0s" }
jactionlint = "latest"
mr-boxington = { version = "latest", minimum_release_age = "0s" }
# communique rewrites release bodies. Resolved by mise.lock rather than floating,
# so release-plz.yml's MISE_LOCKED install cannot pick up an unreviewed build.
# Bump with `mise lock`, deliberately.
communique = { version = "latest", minimum_release_age = "0s" }
# The bats tests parse `--json` output with it.
jq = "latest"
# hk.pkl lints the bats tests with these.
shellcheck = "latest"
shfmt = "latest"
# `lint:deps` and hk.pkl fail on a dependency no code uses.
"github:Boshen/cargo-shear" = "latest"
node = "24"
# Renders docs/cli from the usage spec the binary serves.
usage = { version = "latest", minimum_release_age = "0s" }
# Rust is deliberately absent: it comes from the runner image in CI and from
# rustup locally, so a new stable is caught by CI rather than by a user.

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks.build]
alias = "b"
description = "Build the debug binary"
run = "cargo build --workspace --all-targets"

[tasks.test]
alias = "t"
description = "Run the Rust tests, the end-to-end tests and the benchmark harness's own tests"
depends = ["test:cargo", "test:e2e", "test:bench"]

[tasks."test:cargo"]
description = "Run the Rust unit and integration tests"
# After `build`, not beside it: the end-to-end tests run target/debug/jouet,
# and a cargo writing that file while a test starts it fails the test.
depends = ["build"]
run = "cargo test --workspace --all-targets"

[tasks."test:e2e"]
description = "Run the end-to-end tests: bats on Unix, Pester (e2e-win/) on Windows"
depends = ["build"]
run = "bats test"
run_windows = "pwsh -NoProfile e2e-win/run.ps1"

[tasks."test:bats"]
description = "Run the bats end-to-end tests"
depends = ["build"]
run = "bats test"

[tasks."test:bench"]
description = "Test the agent benchmark harness, and prove each task's check and fake GitHub, without running an agent"
# check-tasks runs target/debug/jouet against each task's fake GitHub.
depends = ["build"]
run = [
    "python3 -m unittest discover -s bench/tests -t bench",
    "python3 bench/agents.py check-tasks",
]

# The agent benchmark (docs/benchmarks.md) runs real agents, spending model
# tokens, so nothing else depends on it. Arguments pass through:
# `mise run bench:agents --harness claude --rounds 5`, or `--dry-run` for the plan.
[tasks."bench:agents"]
description = "Run coding agents on the benchmark tasks with and without jouet, and compare (spends model tokens)"
depends = ["build"]
run = "python3 bench/agents.py run"

[tasks."bench:agents:smoke"]
description = "Run the benchmark's smoke task once per harness and arm, to check the harness works"
depends = ["build"]
run = "python3 bench/agents.py run --smoke"

[tasks.lint]
description = "Check formatting, run clippy and look for unused dependencies"
depends = ["lint:fmt", "lint:clippy", "lint:deps"]

[tasks."lint:fmt"]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks."lint:clippy"]
description = "Run clippy, warnings as errors"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."lint:deps"]
description = "Fail on a dependency no crate uses (workspace-level ones too), or a .rs file no crate compiles"
# A false positive (a crate depended on only to turn on one of its features, say)
# goes in that crate's `[package.metadata.cargo-shear] ignored`, with a comment.
run = "cargo-shear --deny-warnings"

[tasks.lint-fix]
description = "Auto-fix formatting and the clippy lints that can be fixed"
run = [
    "cargo fmt --all",
    "cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged -- -D warnings",
    "cargo-shear --fix",
]

[tasks.ci]
description = "Everything CI runs"
depends = ["build", "test", "lint"]

[tasks.docs]
description = "Start the documentation development server"
depends = ["render"]
dir = "docs"
run = "aube install && exec aube run docs:dev"

[tasks."docs:build"]
description = "Build the documentation website"
depends = ["render"]
dir = "docs"
run = "aube install && exec aube run docs:build"

[tasks."docs:check"]
description = "Check that the generated CLI reference and man page are current"
depends = ["render"]
run = "git diff --exit-code -- docs/cli man && test -z \"$(git status --porcelain --untracked-files=all -- docs/cli man)\""

[tasks.render]
description = "Generate the CLI reference in docs/cli and the man page in man/ from the usage spec"
depends = ["build"]
run = [
    "rm -rf docs/cli man",
    # The version is left out of the spec so a release, which bumps it, does not
    # make docs/cli or the man page stale; the site's nav reads it from
    # Cargo.toml instead.
    "target/debug/jouet __usage_spec__ | grep -v '^version ' | usage generate markdown --file - --multi --replace-pre-with-code-fences --url-prefix /cli --out-dir docs/cli",
    "mkdir -p man/man1",
    "target/debug/jouet __usage_spec__ | grep -v '^version ' | usage generate manpage --file - --out-file man/man1/jouet.1",
]

# The secret scanner's rules are gitleaks' own config, vendored unchanged with
# its licence. `mise run secrets:update` takes the latest release's;
# `mise run secrets:update v8.30.1` a given one. Review the diff, and run the
# tests: one checks that every rule compiles.
[tasks."secrets:update"]
description = "Vendor gitleaks' detection rules and licence into crates/jouet-secrets/gitleaks"
usage = 'arg "[tag]" help="A gitleaks release tag; the latest when omitted"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag="${usage_tag:-}"
if [ -z "$tag" ]; then
  tag=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
fi
dir=crates/jouet-secrets/gitleaks
curl -fsSL -o "$dir/gitleaks.toml" "https://raw.githubusercontent.com/gitleaks/gitleaks/$tag/config/gitleaks.toml"
curl -fsSL -o "$dir/LICENSE" "https://raw.githubusercontent.com/gitleaks/gitleaks/$tag/LICENSE"
printf '%s\n' "$tag" >"$dir/VERSION"
echo "gitleaks rules: $tag ($(grep -c '^\[\[rules\]\]' "$dir/gitleaks.toml") rules)"
'''
