# mise.lock is lockfile revision 3 (forge repository IDs), which mise reads
# from 2026.9.16.
min_version = "2026.9.16"

# bats and its helpers are git submodules under test/, pinned so a checkout runs
# the same test runner as CI. `git submodule update --init --recursive` once.
[env]
_.path = ["test/bats/bin"]

[tools]
# aube installs the documentation site's dependencies from docs/aube-lock.yaml.
aube = { version = "latest", lazy = true, lazy_bins = ["aube"], minimum_release_age = "0s" }
# hk.pkl amends a pinned hk package; the tool itself floats and is resolved by mise.lock.
hk = { version = "latest", minimum_release_age = "0s" }
jactionlint = "latest"
mr-boxington = { version = "latest", minimum_release_age = "0s" }
# communique rewrites release bodies. Resolved by mise.lock rather than floating,
# so release-plz.yml's MISE_LOCKED install cannot pick up an unreviewed build.
# Bump with `mise lock`, deliberately.
communique = { version = "latest", minimum_release_age = "0s" }
# The bats tests parse `--json` output with it.
jq = "latest"
# hk.pkl lints the bats tests with these.
shellcheck = "latest"
shfmt = "latest"
node = "24"
# Renders docs/cli from the usage spec the binary serves.
usage = { version = "latest", minimum_release_age = "0s" }
# Rust is deliberately absent: it comes from the runner image in CI and from
# rustup locally, so a new stable is caught by CI rather than by a user.

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks.build]
alias = "b"
description = "Build the debug binary"
run = "cargo build --all-targets"

[tasks.test]
alias = "t"
description = "Run the Rust tests and the end-to-end tests"
depends = ["test:cargo", "test:e2e"]

[tasks."test:cargo"]
description = "Run the Rust unit and integration tests"
# After `build`, not beside it: the end-to-end tests run target/debug/jouet,
# and a cargo writing that file while a test starts it fails the test.
depends = ["build"]
run = "cargo test --all-targets"

[tasks."test:e2e"]
description = "Run the end-to-end tests: bats on Unix, Pester (e2e-win/) on Windows"
depends = ["build"]
run = "bats test"
run_windows = "pwsh -NoProfile e2e-win/run.ps1"

[tasks."test:bats"]
description = "Run the bats end-to-end tests"
depends = ["build"]
run = "bats test"

[tasks.lint]
description = "Check formatting and run clippy"
depends = ["lint:fmt", "lint:clippy"]

[tasks."lint:fmt"]
description = "Check formatting"
run = "cargo fmt --check"

[tasks."lint:clippy"]
description = "Run clippy, warnings as errors"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.lint-fix]
description = "Auto-fix formatting and the clippy lints that can be fixed"
run = [
    "cargo fmt",
    "cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged -- -D warnings",
]

[tasks.ci]
description = "Everything CI runs"
depends = ["build", "test", "lint"]

[tasks.docs]
description = "Start the documentation development server"
depends = ["render"]
dir = "docs"
run = "aube install && exec aube run docs:dev"

[tasks."docs:build"]
description = "Build the documentation website"
depends = ["render"]
dir = "docs"
run = "aube install && exec aube run docs:build"

[tasks."docs:check"]
description = "Check that the generated CLI reference is current"
depends = ["render"]
run = "git diff --exit-code -- docs/cli && test -z \"$(git status --porcelain --untracked-files=all -- docs/cli)\""

[tasks.render]
description = "Generate the CLI reference in docs/cli from the usage spec"
depends = ["build"]
run = [
    "rm -rf docs/cli",
    # The version is left out of the spec so a release, which bumps it, does not
    # make docs/cli stale; the site's nav reads it from Cargo.toml instead.
    "target/debug/jouet __usage_spec__ | grep -v '^version ' | usage generate markdown --file - --multi --replace-pre-with-code-fences --url-prefix /cli --out-dir docs/cli",
]
