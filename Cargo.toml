[package]
name = "jouet"
version = "0.0.0"
edition = "2024"
# usage-rs 7's own floor. CI checks it in the msrv job.
rust-version = "1.91"
description = "A toolkit CLI for coding agents"
keywords = ["cli", "agents", "github", "ci"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/jdx/jouet"
# Published crates carry the source and its licence, not the machinery used to
# develop and ship it. Add new repository tooling files here.
exclude = [
    ".agents/",
    ".claude/",
    ".codex/",
    ".github/",
    ".gitignore",
    "AGENTS.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "Cross.toml",
    "SECURITY.md",
    "communique.toml",
    "deny.toml",
    "hk.pkl",
    "mise.lock",
    "mise.toml",
    "release-plz.toml",
    "renovate.json",
]

[dependencies]
usage-rs = "7"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 1
