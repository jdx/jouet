[package]
name = "jouet"
version = "0.0.1"
edition = "2024"
# usage-rs 7's own floor. CI checks it in the msrv job.
rust-version = "1.91"
description = "A toolkit CLI for coding agents"
keywords = ["cli", "agents", "github", "ci"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/jdx/jouet"
# Published crates carry the source and its licence, not the machinery used to
# develop and ship it. A list of what to ship, so files added to the repository
# (or left untracked in a checkout) are never published by accident.
include = ["/src/**", "/LICENSE", "/README.md"]

[dependencies]
mise-agent-env = "2026"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.11"
similar = "3"
tempfile = "3"
# TLS trusts the system's root certificates, with ring for crypto. ureq's
# default bundles webpki-roots, and its platform verifier pulls in
# webpki-root-certs; the org's dependency policy does not allow their licence
# (CDLA-Permissive-2.0).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
ureq = { version = "3", default-features = false, features = ["gzip", "rustls-no-provider"] }
usage-rs = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 1

[dev-dependencies]
serde_json = "1"
tempfile = "3"
