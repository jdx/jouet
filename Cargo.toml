[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo test`, `clippy` and `check` at the root cover every crate.
default-members = [".", "crates/*"]

[workspace.package]
# `version` is deliberately absent: each crate carries its own, and
# release-plz.toml says how they move.
edition = "2024"
# usage-rs 7's own floor. CI checks it in the msrv job.
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/jdx/jouet"
# Every crate ships the workspace README, so a crates.io page describes the
# whole tool rather than repeating a paragraph per crate.
readme = "README.md"

[workspace.dependencies]
ast-grep-core = "0.51"
jouet-audit = { path = "crates/jouet-audit", version = "0.0.1" }
jouet-edit = { path = "crates/jouet-edit", version = "0.0.1" }
jouet-git = { path = "crates/jouet-git", version = "0.0.1" }
jouet-github = { path = "crates/jouet-github", version = "0.0.1" }
jouet-output = { path = "crates/jouet-output", version = "0.0.1" }
jouet-routines = { path = "crates/jouet-routines", version = "0.0.1" }
jouet-rules = { path = "crates/jouet-rules", version = "0.0.1" }
jouet-search = { path = "crates/jouet-search", version = "0.0.1" }
jouet-wait = { path = "crates/jouet-wait", version = "0.0.1" }
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
libc = "0.2"
memchr = "2"
mise-agent-env = "2026"
mlua = { version = "0.12", features = ["luau"] }
petgraph = { version = "0.8", default-features = false, features = ["std"] }
regex = "1"
# TLS trusts the system's root certificates, with ring for crypto. ureq's
# default bundles webpki-roots, and its platform verifier pulls in
# webpki-root-certs; the org's dependency policy does not allow their licence
# (CDLA-Permissive-2.0).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# tree-sitter and the grammars jouet-search compiles in. The grammars depend
# only on tree-sitter-language, so any of their versions works with this
# tree-sitter; ast-grep-core must share it, since tree-sitter links its C
# runtime once.
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-tags = "0.27"
tree-sitter-typescript = "0.23"
zstd = "0.14"
ureq = { version = "3", default-features = false, features = ["gzip", "rustls-no-provider"] }
usage-config = { version = "7", features = ["toml"] }
usage-rs = "7"
# Routines' usage specs are KDL read at run time. Its help templates are left
# out: jouet-routines renders a routine's help itself, for 1.5 MB less binary.
usage-lib = { version = "7", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

# The library crates opt in, so everything they export is something the binary
# or a sibling crate uses, and the rest is `pub(crate)`.
[workspace.lints.rust]
unreachable_pub = "deny"

[package]
name = "jouet"
version = "0.0.1"
description = "A toolkit CLI for coding agents"
keywords = ["cli", "agents", "github", "ci"]
categories = ["command-line-utilities", "development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# Published crates carry the source and its licence, not the machinery used to
# develop and ship it. A list of what to ship, so files added to the repository
# (or left untracked in a checkout) are never published by accident.
include = ["/src/**", "/LICENSE", "/README.md"]
# src/bin/joue.rs is the `joue` launcher; `cargo run` means jouet.
default-run = "jouet"

[lints]
workspace = true

[dependencies]
jouet-audit.workspace = true
jouet-edit.workspace = true
jouet-git.workspace = true
jouet-github.workspace = true
jouet-output.workspace = true
jouet-routines.workspace = true
jouet-rules.workspace = true
jouet-search.workspace = true
jouet-wait.workspace = true
mise-agent-env.workspace = true
regex.workspace = true
serde.workspace = true
# Keeps the key order of the harness settings files `setup` rewrites.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
similar.workspace = true
tempfile.workspace = true
toml.workspace = true
usage-config.workspace = true
usage-rs = { workspace = true, features = ["config", "completions"] }

[features]
default = ["grammars"]
# Tree-sitter grammars for symbols, outlines and the repository map. Without
# them, `jouet search` is plain search and `jouet read --map` is unavailable.
grammars = ["jouet-search/grammars"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 1

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
