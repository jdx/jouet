name: release-plz

# release-plz watches main, opens a release PR that bumps the version and
# writes the changelog, and on merge tags, publishes to crates.io and drafts
# the GitHub release. `release.yml` then attaches binaries and this workflow
# publishes the draft.

permissions: {}

on:
  push:
    branches: [main]
  # Manual trigger. This cannot conjure a release out of nothing: release-plz
  # compares packaged file contents against what is on crates.io and opens a
  # PR only when they differ.
  workflow_dispatch:

# One run at a time, never cancelled: a second run reaching the publish step
# while the first is mid-publish would duplicate a version or fail half-way,
# and cancelling a publish is worse than waiting for one. Workflow-level, so it
# also covers the release job racing the next run's release-pr job.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Forks should never attempt to publish, and neither should this repository
    # while it is private: publishing to crates.io would make the source public.
    if: ${{ github.repository_owner == 'jdx' && !github.event.repository.private }}
    permissions:
      contents: write
      # Required for crates.io trusted publishing: the OIDC token proves this
      # workflow, in this repository, is the configured publisher. No
      # long-lived CARGO_REGISTRY_TOKEN exists anywhere.
      id-token: write
    outputs:
      tag: ${{ steps.jouet-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Exchanges the OIDC token for a short-lived crates.io token. The crate's
      # Trusted Publisher names this repository and this workflow file, so
      # renaming this file breaks publishing.
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      # Selected by package name rather than `releases[0]`, so adding a second
      # crate later cannot hand the binary-upload job the wrong tag.
      - name: Find the jouet tag
        id: jouet-tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=""
          if [ -n "$RELEASES" ]; then
            tag=$(jq -r '[.[] | select(.package_name == "jouet")][0].tag // ""' <<<"$RELEASES")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "jouet tag: ${tag:-<none released>}"

  # Binaries are attached to the draft, then the draft is published — so a
  # release is never visible without its assets.
  upload-assets:
    name: Upload assets
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    permissions:
      contents: write
      # release.yml declares the manual-only release-fixes notifier. Reusable
      # workflows may not elevate above this caller even when that job skips.
      pull-requests: read
      issues: write
      discussions: write
      # A called workflow's token can only be narrower than its caller's, so
      # the packslip's signing and attestation permissions are granted here.
      id-token: write
      attestations: write
    uses: $/.github/workflows/release.yml
    with:
      tag: ${{ needs.release-plz-release.outputs.tag }}

  # release-plz gives the draft a serviceable changelog body. communique
  # replaces it with prose informed by the commits, PRs and diffs while the
  # binary matrix runs, so the raw notes are never visible.
  #
  # An enhancement rather than a release gate: `continue-on-error` at the job
  # level, so a missing provider key, an install failure or a transient model
  # failure leaves the original release-plz notes intact.
  enhance-release:
    name: Enhance release notes
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # communique diffs this tag against its predecessor.
          fetch-depth: 0
          persist-credentials: false

      # MISE_LOCKED prevents a future `latest` from silently replacing the
      # reviewed communique build. Bump it deliberately with `mise lock`.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: communique
          cache: false
        env:
          MISE_LOCKED: "1"

      # The PAT is intentional: GitHub's release-by-tag endpoint hides drafts,
      # so communique falls back to listing releases, which needs write access.
      - name: Rewrite the draft release body with communique
        env:
          TAG: ${{ needs.release-plz-release.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning title=communique skipped::ANTHROPIC_API_KEY is not configured; keeping the release-plz notes"
            exit 0
          fi
          communique generate "$TAG" --github-release

  publish-release:
    name: Publish release
    needs: [release-plz-release, upload-assets, enhance-release]
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Undraft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same guard as the release job: no release PRs while the repository is private.
    if: ${{ github.repository_owner == 'jdx' && !github.event.repository.private }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run release-plz
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
