name: ci implementation

on:
  workflow_call:
    inputs:
      trusted:
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MBX_DISABLE: "1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Actions are pinned to full commit SHAs. A mutable tag like @v2 or @stable can
# be retargeted at any time, which would swap out executable CI code without
# review.
jobs:
  test:
    runs-on: ${{ !inputs.trusted && 'ubuntu-latest' || 'namespace-profile-endev-linux-amd64;overrides.cache-tag=cache' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bats and its helpers are submodules under test/.
          submodules: recursive
          persist-credentials: false

      # The tasks live in mise.toml so that a laptop and this runner invoke the
      # same commands. Tools install on demand; Rust comes from the runner.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ inputs.trusted && github.ref == 'refs/heads/main' }}
      - name: Install Rust lint components
        run: rustup component add rustfmt clippy

      # hk.pkl runs exactly what `mise run lint` does (cargo fmt --check and
      # clippy -D warnings) plus jactionlint, so it replaces that task here.
      # Online checks (known-vulnerable actions, impostor commits, stale refs) run
      # in CI only; locally: JACTIONLINT_ONLINE=1 hk check --all
      - run: mise x hk -- hk check --all
        env:
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  test-macos:
    runs-on: ${{ !inputs.trusted && 'macos-latest' || 'namespace-profile-endev-macos-arm64;overrides.cache-tag=cache' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bats and its helpers are submodules under test/.
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ inputs.trusted && github.ref == 'refs/heads/main' }}
      # mise installs the task's tools lazily here, and without a token it hits
      # the 60/hr per-IP GitHub API limit that macOS runners share, failing the
      # job before cargo starts.
      - run: mise run test
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Windows runs only what can differ there: clippy over the `#[cfg(windows)]`
  # code the other jobs compile out, and the Pester tests in e2e-win/ (line
  # endings, path syntax, cmd.exe as the --check shell, file locking). The Rust
  # tests and bats cover everything else on Linux and macOS; running them here
  # too would only make this the slowest job. Plain cargo, without mise.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ inputs.trusted && github.ref == 'refs/heads/main' }}
      - name: Install Rust lint components
        run: rustup component add clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked
      - name: Windows end-to-end tests
        run: pwsh -NoProfile e2e-win/run.ps1

  # Cargo.toml's rust-version is a promise to anyone building from crates.io.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.91"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ inputs.trusted && github.ref == 'refs/heads/main' }}
      - name: Check MSRV
        run: cargo check --locked --all-targets

  # Builds every release target the way release.yml does, so a change one of
  # them cannot build (Luau's C++ on an old cross image, say) fails here and
  # not at release time. Compiles and links only; nothing is uploaded.
  release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: jouet
          target: ${{ matrix.target }}
          build-tool: ${{ contains(matrix.target, '-linux-') && 'cross' || 'cargo' }}
          token: ${{ github.token }}
          dry-run: true
      # The same check release.yml runs before signing: the binary must not
      # need a newer glibc than .github/packslip/release.toml declares.
      - name: Check the declared glibc floor
        if: endsWith(matrix.target, '-linux-gnu')
        run: python3 .github/scripts/check-glibc-min.py .github/packslip/release.toml jouet-*.tar.gz

  # Single fan-in gate, so branch protection requires one check instead of an
  # enumerated list that goes stale every time a job is added or renamed. It
  # also catches *skipped* jobs, which a required check would otherwise treat
  # as passing.
  final:
    permissions: {}
    needs:
      - test
      - test-macos
      - test-windows
      - msrv
      - release-build
    runs-on: ubuntu-latest
    timeout-minutes: 1
    # Run on success or upstream failure but skip when the workflow is cancelled
    # — `always()` would override `cancel-in-progress` and waste a runner.
    if: ${{ !cancelled() }}
    steps:
      - name: Check job results
        if: |
          needs.test.result != 'success' ||
          needs.test-macos.result != 'success' ||
          needs.test-windows.result != 'success' ||
          needs.msrv.result != 'success' ||
          needs.release-build.result != 'success'
        run: exit 1
      - run: echo "All CI jobs completed successfully"
