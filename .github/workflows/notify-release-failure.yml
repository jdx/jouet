name: notify-release-failure

# Releases run unattended: release-plz publishes from a push to main, and
# release.yml builds the binaries from within that run (or by hand). Nobody
# reviews either, so a failed job (a crate that never reached crates.io, a
# missing binary, a draft left unpublished) is silent. Email on failure
# instead of waiting for a user to report it.
# no permissions, no checkout, and it only fires for completed release runs
# jactionlint ignore=dangerous-triggers
on:
  workflow_run:
    workflows: [release-plz, release]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    name: notify
    if: ${{ github.repository == 'jdx/jouet' && contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${NOTIFY_EMAIL:-}" ]; then
            echo "::warning::RESEND_API_KEY or NOTIFY_EMAIL is unset; skipping notification for ${WORKFLOW}"
            exit 0
          fi
          # Build the payload with jq: --arg keeps a workflow name from breaking
          # out of the JSON string, and @html keeps it from becoming markup once
          # the mail client renders the body. Neither run knows the version it
          # released (release-plz picks it mid-run), so the mail links the run
          # and the releases page instead of a tag.
          payload=$(jq -n \
            --arg to "$NOTIFY_EMAIL" \
            --arg workflow "$WORKFLOW" \
            --arg conclusion "$CONCLUSION" \
            --arg run_url "$RUN_URL" \
            --arg attempt "$ATTEMPT" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              from: "jouet Releases <mise@en.dev>",
              to: [$to],
              subject: "❌ jouet: \($workflow) \($conclusion)",
              html: (
                "<p>The <strong>\($workflow | @html)</strong> workflow finished with <strong>\($conclusion | @html)</strong> on attempt \($attempt | @html).</p>"
                + "<p>Some of what this release ships may not have gone out. Re-run the failed jobs once the cause is fixed.</p>"
                + "<p><a href=\"\($run_url | @html)\">View workflow run</a> | <a href=\"https://github.com/\($repo)/releases\">Releases</a></p>"
              )
            }')
          # This mail is the only signal that a release half-shipped, so a
          # transient Resend failure must not swallow it. The idempotency key
          # makes a retry of a lost response deliver once.
          curl --fail-with-body -sS \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: jouet-release-failure-${RUN_ID}-${ATTEMPT}" \
            -d "$payload"
