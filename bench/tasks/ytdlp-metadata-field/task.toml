description = "Fix yt-dlp/yt-dlp#14576: parsing metadata into a single field never matches"
chore = "bug-fix"
rules = ["checks", "git-add-all"]
opt_in = true
remote = false
upstream = true
timeout_s = 900
check_timeout_s = 180
python_requirements = "requirements.lock"
prompt = """
`--parse-metadata playlist_autonumber:track` reports that it could not
interpret `playlist_autonumber` as `track`, rather than copying the
playlist number into the track field. This happens when the output is a
single field name; templated output and explicit regular expressions should
continue to work.

Fix the metadata parser in yt-dlp, add tests, and commit your change. The
problem can be exercised with synthetic metadata. Do not run live download
tests or contact external media services; use the project's core tests.
"""

[source]
git = "~/src/yt-dlp"
commit = "ba499ab0dcf2486d97f739e155264b305e0abd26"

[env]
# yt-dlp's default core test command excludes the live download tests.
PYTEST_ADDOPTS = "-m 'not download'"
