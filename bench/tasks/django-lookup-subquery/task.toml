description = "Fix a real Django bug from its ticket (#35972): a custom lookup that adds its lhs and rhs params raises TypeError against a Subquery; with a test, then commit"
chore = "bug-fix"
rules = ["checks", "git-add-all"]
# A real web framework whose fix spans the ORM's lookups, expressions,
# functions and schema editor: it runs only when named.
opt_in = true
remote = false
upstream = true
timeout_s = 1500
check_timeout_s = 300
# asgiref and sqlparse, which Django needs, and tblib, without which its
# parallel runner cannot report a failure on Python 3.13. The install is
# offline, from wheels downloaded once (docs/benchmarks.md).
python_requirements = "requirements.lock"
# jouet levels: out of the box, `jouet test --cmd` digests the unittest
# output of Django's own runner (`python3 tests/runtests.py custom_lookups`),
# but `jouet test --affected` finds no runner: the tests are packages under
# `tests/`, run by `tests/runtests.py`, not pytest or plain unittest
# discovery. Config could name the runner; a Luau routine could map
# `django/db/models/lookups.py` to the test packages that import it
# (`lookup`, `custom_lookups`, `expressions`) and run only those.
# The ticket's title and description as its reporter wrote them (Trac
# markup), and one line. Nothing from the fix (8914f47).
prompt = '''
Custom lookup example raises TypeError when looked up against a Subquery

On the forum I [https://forum.djangoproject.com/t/advanced-postgresql-functions-like-json-to-recordset-json-jsonb-to-recordset-jsonb/35542/5 shared] the TypeError I was getting when registering a custom lookup for a `JSONField`:

{{{#!python
File models/lookups.py:13, in NotEqual.as_sql(self, compiler, connection)
     11 lhs, lhs_params = self.process_lhs(compiler, connection)
     12 rhs, rhs_params = self.process_rhs(compiler, connection)
---> 13 params = lhs_params + rhs_params
     14 return "%s <> %s" % (lhs, rhs), params

TypeError: can only concatenate list (not "tuple") to list
}}}

Since this problematic pattern is [https://docs.djangoproject.com/en/4.2/howto/custom-lookups/#a-lookup-example documented], we should either fix the documentation or fix the underlying reason it doesn't work. I haven't looked into whether there are backwards-compatible ways to do the latter.

Reproduction is just to follow the documented pattern and register it with a JSONField e.g. `@JSONField.register_lookup`, and then try to use it in an ORM query.

Fix this in Django, with a test, and commit.
'''

# Django at the fix's base, the parent of 8914f47.
[source]
git = "~/src/django"
commit = "079d31e698fa08dd92e2bc4f3fe9b4817a214419"

# The checkout is Django: its runner imports it from the work tree. Pip
# installs the requirements from the prepared wheels, never the index.
[env]
PYTHONPATH = "{workdir}"
PIP_NO_INDEX = "1"
PIP_FIND_LINKS = "~/src/django-bench-wheels"

# Timed once, for the cost note every run starts with (bench/jbench/costs.py).
[cost]
seed = [
    "python3 tests/runtests.py custom_lookups",
    "python3 tests/runtests.py lookup custom_lookups expressions",
]
