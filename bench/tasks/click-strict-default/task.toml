description = "Render a strictly comparable option default in pallets/click#3298"
chore = "bug-fix"
rules = ["checks", "git-add-all"]
opt_in = true
remote = false
upstream = true
timeout_s = 900
check_timeout_s = 180
python_requirements = "requirements.lock"
isolated_setup = [
    ["python3", "-m", "pip", "install", "--no-deps", "--no-build-isolation", "-e", "{workdir}"],
    ["python3", "-m", "ruff", "--version"],
]
prompt = """
An option with `show_default=True` can crash while rendering help when its
non-string default refuses comparison to an empty string. For example, a
`semver.Version` default raises `ValueError` when compared to `""`. Render
such defaults without that comparison and preserve how empty string defaults
appear in help.

Fix the help behavior, add tests, and commit your change.
"""

[source]
git = "~/src/click-bench-source"
commit = "04ef3a6f473deb2499721a8d11f92a7d2c0912f2"

[env]
PYTHONPATH = "{workdir}/src"
