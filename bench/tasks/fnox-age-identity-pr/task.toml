description = "A whole PR session on real fnox code (jdx/fnox#1099): wait for CI on the PR, fix what fails, address five bot review threads, commit"
chore = "pr-session"
rules = ["checks", "git-add-all", "review-threads", "sleep-poll", "ci-rerun"]
# A real Rust workspace with a full build of fnox: it runs only when named.
opt_in = true
branch = "age-named-identity"
# The PR is on GitHub (the fake), and the clone has origin/main to measure
# the change from.
remote = true
upstream = true
timeout_s = 3600
check_timeout_s = 900
path = ["~/.cargo/bin"]
# jouet levels: out of the box, `jouet wait ci`, `jouet pr threads` and
# `jouet pr next` read the PR from the fake, and `jouet test` digests cargo's
# and bats' output. CI fails on `mise run render` leaving a diff in
# docs/public/schema.json, which a Luau rule or routine could name: the
# schema is `fnox schema`, generated from crates/fnox-core/providers/*.toml.
# The PR at its first push (c3049c4): CI's ci-other jobs fail on the render
# check, and Greptile and CodeRabbit leave threads on the identity selection.
# Upstream fixed both in ace6c26, which also answered the heavy-lift thread
# about `key_file` resolving first by deferring it (in a later reply).
prompt = """
PR #1099 (branch age-named-identity, checked out here) lets fnox's age provider select a named
identity with `default_identity` or `FNOX_AGE_IDENTITY`. CI is running on it, and reviewers have
left comments. Get it ready: wait for CI and fix what fails, and address the open review threads:
make the requested changes, reply on each thread saying what you did, and resolve the ones you
fixed. A thread you decide not to act on in this PR gets a reply saying why and stays open. Commit
your changes; don't push.
"""

# The PR's base, 7f5ee40 on main; `pr/` holds the files c3049c4 changed. The
# work tree's submodules (bats and its helpers) are fetched from GitHub
# during setup.
[source]
git = "~/src/fnox"
commit = "7f5ee4088a676e94930fefce717d2b9fc5b596a0"

# Resolve mise from the benchmark environment, as mise-uninstall-pr does, so
# an agent can run the repository's own `mise run render`.
[tools]
mise = "mise"

[env]
RUSTUP_HOME = "~/.rustup"
CARGO_HOME = "~/.cargo"
MISE_TRUSTED_CONFIG_PATHS = "{workdir}"

# Timed once, for the cost note every run starts with (bench/jbench/costs.py).
[cost]
seed = [
    "cargo build",
    "cargo test -p fnox-core --lib providers::age",
    "test/bats/bin/bats test/age.bats",
]

[[probe]]
tool = "jouet"
args = ["wait", "ci", "1099", "--json"]
exit = 1

[[probe]]
tool = "jouet"
args = ["pr", "threads", "1099", "--json"]
stdout_contains = "Daemon keeps the first identity"

[[probe]]
tool = "jouet"
args = ["pr", "threads", "reply", "55503", "1099", "--body", "FNOX_AGE_IDENTITY is read on every selection now.", "--resolve", "--json"]

[[probe]]
tool = "gh"
args = ["pr", "checks", "1099"]
exit = 1

[[probe]]
tool = "gh"
args = ["run", "view", "9001", "--log-failed"]
stdout_contains = "docs/public/schema.json"
