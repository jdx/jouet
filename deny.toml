# cargo-deny configuration. CI runs `cargo deny check` (advisories, bans,
# licenses and sources) through EmbarkStudios/cargo-deny-action.

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  # foldhash, through serde_json's `preserve_order`, which `jouet setup` uses
  # to keep the key order of the settings files it edits. mise and
  # mr-boxington allow it too.
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
