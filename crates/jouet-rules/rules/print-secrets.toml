#:schema https://jouet.jdx.dev/schema/rules.json
[[rule]]
name = "print-secrets"
why = "Printing secret values puts them in the transcript, which leaves the machine with every turn and outlives the session."
mode = "deny"
scope = "builtin"
author = "builtin"
created = "2026-10-31"
suggest = "fnox exec -- <command>"
message = "It hands the command the project's secrets as environment variables without printing them. This call would print secret values into the transcript. To check that a secret exists, use `fnox list`, which shows names only."

# `env`, `printenv` and `export -p` with nothing to run list every variable,
# and in a fnox project those may hold secrets. `env FOO=1 cmd` runs `cmd`.
[[rule.match]]
fnox = true
command = "env"
max_args = 0
value_flags = ["-u", "--unset", "-C", "--chdir", "-S", "--split-string"]

[[rule.match]]
fnox = true
command = "printenv"
max_args = 0

[[rule.match]]
fnox = true
command = "printenv"
secret_args = true

[[rule.match]]
fnox = true
command = "export"
max_args = 0

# Bare `set` lists variables; `set -e` and `set -o pipefail` do not.
[[rule.match]]
fnox = true
command = "set"
max_args = 0
exact_flags = []

# `echo $DATABASE_URL`, for a name the project's fnox config defines. Piped
# into another program or redirected to a file, it does not reach the
# transcript.
[[rule.match]]
fnox = true
command = ["echo", "printf"]
secret_vars = true
prints = true

# fnox's own commands that print values, wherever its config is.
[[rule.match]]
command = "fnox get"
prints = true

[[rule.match]]
command = "fnox export"
unless_flags = ["-o", "--output", "-n", "--dry-run"]
value_flags = ["-f", "--format", "-o", "--output"]
prints = true

[[rule.match]]
command = "fnox list"
flags = ["-V", "--values"]
prints = true

[[rule.match]]
command = "fnox env"
unless_flags = ["--describe"]
value_flags = ["--for", "--keys"]
prints = true

[rule.examples]
fires = [
  { command = "env", fnox = {} },
  { command = "env | sort", fnox = {} },
  { command = "env | grep TOKEN", fnox = {} },
  { command = "env -u HOME", fnox = {} },
  { command = "printenv", fnox = {} },
  { command = "printenv STRIPE_KEY", fnox = { secrets = ["STRIPE_KEY"] } },
  { command = "export -p", fnox = {} },
  { command = "set", fnox = {} },
  { command = "echo $DATABASE_URL", fnox = { secrets = ["DATABASE_URL"] } },
  { command = "echo \"url: ${DATABASE_URL}\"", fnox = { secrets = ["DATABASE_URL"] } },
  { command = "printf '%s\\n' \"$STRIPE_KEY\"", fnox = { secrets = ["STRIPE_KEY"] } },
  { command = "cd app && echo $STRIPE_KEY", fnox = { secrets = ["STRIPE_KEY"] } },
  "fnox get STRIPE_KEY",
  "fnox get --base64-decode CERT",
  "fnox export",
  "fnox export -f json",
  "fnox list -V",
  "fnox env --json",
  { command = "fnox get STRIPE_KEY", harness = "codex" },
]
quiet = [
  # Not a fnox project: the environment is the agent's own business.
  "env",
  "printenv",
  { command = "echo $DATABASE_URL", fnox = { secrets = ["STRIPE_KEY"] } },
  # A wrapper that runs another command, or one variable that is no secret.
  { command = "env FOO=bar cargo test", fnox = {} },
  { command = "env -u HOME npm test", fnox = {} },
  { command = "printenv HOME", fnox = { secrets = ["STRIPE_KEY"] } },
  { command = "export PATH=$PATH:/opt/bin", fnox = {} },
  { command = "set -euo pipefail", fnox = {} },
  { command = "set -e", fnox = {} },
  # Single quotes do not expand; a pipe or a file keeps the value out.
  { command = "echo '$STRIPE_KEY'", fnox = { secrets = ["STRIPE_KEY"] } },
  { command = "echo \"$GH_TOKEN\" | gh auth login --with-token", fnox = { secrets = ["GH_TOKEN"] } },
  { command = "echo $STRIPE_KEY > .stripe-key", fnox = { secrets = ["STRIPE_KEY"] } },
  { command = "echo $HOME", fnox = { secrets = ["STRIPE_KEY"] } },
  { command = "echo STRIPE_KEY is set", fnox = { secrets = ["STRIPE_KEY"] } },
  # fnox commands that keep values out of the output.
  "fnox exec -- npm test",
  "fnox get STRIPE_KEY > key.txt",
  "fnox get STRIPE_KEY | pbcopy",
  "export STRIPE_KEY=$(fnox get STRIPE_KEY)",
  "fnox export -o .env",
  "fnox export --output=.env -f env",
  "fnox list",
  "fnox list --sources",
  "fnox env --describe",
  "echo 'fnox get STRIPE_KEY'",
  "git commit -m 'use fnox get instead of env'",
]
