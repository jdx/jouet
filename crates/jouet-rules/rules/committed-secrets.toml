#:schema https://jouet.jdx.dev/schema/rules.json
[[rule]]
name = "committed-secrets"
why = "A secret in a commit is in the history of every copy once it is pushed, and taking it out later does not take it back; only rotating it does."
mode = "deny"
scope = "builtin"
author = "builtin"
created = "2026-10-31"
needs = ["commit"]
# It denies on what a commit or push holds, not on how the command looks, so
# naming it at session start would save no call.
primer = false
# The matcher finds a commit or a push; the script asks gitleaks' rules what
# the lines it would add hold (`jouet.secrets.scan`), which a matcher cannot.
# Only gitleaks' generic rule finding something warns rather than denies: it
# is the one most often wrong.
script = "committed-secrets.luau"

[[rule.match]]
command = "git commit"
unless_flags = ["--dry-run", "-h", "--help"]

# A push that sends commits: not a dry run, a deletion or help.
[[rule.match]]
command = "git push"
unless_flags = ["-n", "--dry-run", "-d", "--delete", "-h", "--help"]
unless_args = ":*"

[rule.examples]
fires = [
  { command = "git commit -m 'add config'", secrets = [{ rule = "github-pat", path = "src/config.rs", line = 3 }], action = "deny" },
  { command = "git add src/config.rs && git commit -m x", secrets = [{ rule = "aws-access-token", path = "src/config.rs", line = 1 }], action = "deny" },
  { command = "git commit -am x", secrets = [{ rule = "private-key", path = "deploy/key.pem", line = 1 }, { rule = "generic-api-key", path = "app.py", line = 9 }], action = "deny" },
  { command = "git push -u origin feat/x", secrets = [{ rule = "slack-bot-token", path = "bot.js", line = 2, commit = "0123456789abcdef0123456789abcdef01234567" }], action = "deny" },
  { command = "git commit -m x", secrets = [{ rule = "generic-api-key", path = "app.py", line = 9 }], action = "warn" },
  { command = "git -C ../repo commit -m x", secrets = [{ rule = "github-pat", path = "a", line = 1 }] },
]
quiet = [
  # Nothing found, or the scan had no answer (too large a diff, or no repository).
  { command = "git commit -m x", secrets = [] },
  "git commit -m x",
  "git push",
  # Nothing would be committed or pushed.
  { command = "git commit --dry-run", secrets = [{ rule = "github-pat", path = "a", line = 1 }] },
  { command = "git push --dry-run", secrets = [{ rule = "github-pat", path = "a", line = 1 }] },
  { command = "git push origin --delete old", secrets = [{ rule = "github-pat", path = "a", line = 1 }] },
  { command = "git status", secrets = [{ rule = "github-pat", path = "a", line = 1 }] },
  { command = "echo 'git commit'", secrets = [{ rule = "github-pat", path = "a", line = 1 }] },
  # jouet commit runs the same scan itself.
  { command = "jouet commit a -m x", secrets = [{ rule = "github-pat", path = "a", line = 1 }] },
]
