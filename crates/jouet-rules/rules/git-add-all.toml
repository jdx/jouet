#:schema https://jouet.jdx.dev/schema/rules.json
[[rule]]
name = "git-add-all"
why = "`git add -A` and `git add .` stage everything, including caches, scratch files and other sessions' work."
mode = "deny"
scope = "builtin"
author = "builtin"
created = "2026-10-30"
suggest = "git add path/to/file ..."
message = "`git add -A` and `git add .` sweep in caches, scratch files and other sessions' work."

[[rule.match]]
command = "git add"
flags = ["-A", "--all"]

[[rule.match]]
command = "git add"
args = [".", "./", ":/", ":/."]

[rule.examples]
fires = [
  "git add -A",
  "git add --all",
  "git add .",
  "git -C repo add -A && git commit -m x",
  "git add -fA",
  "git add -- .",
  "rtk git add .",
]
quiet = [
  "git add src/main.rs",
  "git add ./src/main.rs",
  "git commit -m 'git add -A'",
  "git commit -m \"$(cat <<'EOF'\nnever git add -A\nEOF\n)\"",
  "echo git add .",
  "git add -u",
  "git add -p src",
]
