#:schema https://jouet.jdx.dev/schema/rules.json
[[rule]]
name = "trust-rules"
why = "A repository's rules put text in front of the agent, so an agent that could trust them could be talked into trusting them; trusting rules and adding a rule pack are the user's decisions."
mode = "deny"
scope = "builtin"
author = "builtin"
created = "2026-10-31"
message = "Trusting rules is the user's decision; ask them to run `jouet rule trust` (or `jouet rule pack add`) in a terminal. `--yes` is for scripts and CI the user runs, not for an agent."

[[rule.match]]
command = "jouet rule trust"
unless_flags = ["--list", "--help", "-h"]

[[rule.match]]
command = "jouet rule pack add"
unless_flags = ["--help", "-h"]

[rule.examples]
fires = [
  "jouet rule trust",
  "jouet rule trust --yes",
  "jouet rule trust --system --yes",
  "cd repo && jouet rule trust --yes",
  "jouet rule pack add team https://github.com/acme/jouet-rules --yes",
  "jouet rule pack add team ../team-rules --repo --yes",
  "mise x -- jouet rule trust --yes",
  "/usr/local/bin/jouet rule trust --yes",
  "jouet --json rule trust --yes",
  "bash -c 'jouet rule trust --yes'",
]
quiet = [
  "jouet rule trust --list",
  "jouet rule trust --help",
  "jouet rule untrust",
  "jouet rule list",
  "jouet rule pack ls",
  "jouet rule pack sync",
  "jouet rule pack rm team",
  "jouet rule pack add --help",
  "echo 'jouet rule trust --yes'",
  "git commit -m 'jouet rule trust --yes'",
]
