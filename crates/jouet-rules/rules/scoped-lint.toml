#:schema https://jouet.jdx.dev/schema/rules.json
[[rule]]
name = "scoped-lint"
why = "While iterating, linting the whole project re-reports every file and costs minutes and pages of output; checking only the changed files through hk gives their findings as file:line:rule."
mode = "warn"
scope = "builtin"
author = "builtin"
created = "2026-10-30"
needs = ["diag", "check"]
# The matcher finds a lint of the whole project; the script stays quiet
# when the work tree has nothing uncommitted (a check of a merge, a pull or
# a checkout), since there is no change to iterate on.
script = "scoped-lint.luau"

# `cargo clippy` cut short with head or tail: the findings that matter may
# be the ones cut off.
[[rule.match]]
command = "cargo clippy"
unless_flags = ["-p", "--package", "--fix"]
with = { command = ["head", "tail"] }

# eslint over the whole tree.
[[rule.match]]
command = ["eslint", "npx eslint", "pnpm eslint", "pnpm exec eslint", "yarn eslint", "bunx eslint"]
args = [".", "./"]
unless_flags = ["--fix"]

# The project's whole lint task, with nothing passed to it.
[[rule.match]]
command = "mise run lint"
max_args = 0

[rule.examples]
fires = [
  "cargo clippy --workspace --all-targets 2>&1 | head -50",
  "cargo clippy -- -D warnings | tail -20",
  "npx eslint .",
  "eslint .",
  "pnpm exec eslint ./",
  "mise run lint",
  "cd crate && mise run lint",
  { command = "cargo clippy --workspace 2>&1 | head -20", git = { dirty = true } },
  { command = "cargo clippy --all-targets 2>&1 | grep -E '^(warning|error)' | head -40", git = { dirty = true } },
  { command = "cargo fmt --all && cargo clippy -- -D warnings 2>&1 | tail -20", git = { dirty = true } },
]
quiet = [
  { command = "cargo clippy --workspace --all-targets -- -D warnings 2>&1 | head -20", git = { dirty = false } },
  # The full check, as CI runs it, before pushing.
  { command = "cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | grep -vE '^mbx' | tail -5", git = { dirty = true } },
  { command = "cargo clippy --all-targets --all-features -- -Dwarnings | tail", git = { dirty = true } },
  # A lint in the same call as the test suite.
  { command = "cargo clippy --workspace 2>&1 | tail -3; cargo test --workspace 2>&1 | tail -3", git = { dirty = true } },
  { command = "mise run lint; mise run test:e2e", git = { dirty = true } },
  { command = "mise run lint", git = { dirty = false } },
  { command = "npx eslint .", git = { dirty = false } },
  "cargo clippy -p jouet-diag 2>&1 | head",
  "cargo clippy --workspace -- -D warnings",
  "cargo clippy --fix --allow-dirty | tail",
  "npx eslint src/a.ts",
  "npx eslint --fix .",
  "mise run lint-fix",
  "mise run lint:clippy",
  "jouet diag check --changed",
  "hk check --files src/a.rs",
  "echo 'mise run lint'",
]
