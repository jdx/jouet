#:schema https://jouet.jdx.dev/schema/rules.json
[[rule]]
name = "sleep-poll"
why = "A sleep loop around a CI query spends a model turn on every check; `jouet wait ci` blocks until the checks settle."
mode = "deny"
scope = "builtin"
author = "builtin"
created = "2026-10-30"
needs = ["wait", "ci"]
suggest = "jouet wait ci"
message = "It blocks until the checks settle and prints the failing logs, where a sleep loop spends a model turn on every check (`jouet agent-help wait`)."

[[rule.match]]
command = ["gh pr checks", "gh run view"]
with = { command = "sleep", args = "*" }

[[rule.match]]
command = "gh pr view"
text = "statusCheckRollup"
with = { command = "sleep", args = "*" }

[rule.examples]
fires = [
  "sleep 60 && gh pr checks 123",
  "while true; do gh pr checks; sleep 30; done",
  "until gh run view 42 --exit-status; do sleep 20; done",
  "sleep 90; gh pr view 7 --json statusCheckRollup",
  "bash -c 'sleep 30; gh pr checks'",
]
quiet = [
  "gh pr checks 123",
  "sleep 5 && curl localhost:8080",
  "echo 'sleep 30; gh pr checks'",
  "git commit -m 'sleep 60 then gh pr checks'",
  "gh pr checks --watch",
  "sleep && gh pr checks",
  "gh pr view 7 --json title && sleep 5",
]
