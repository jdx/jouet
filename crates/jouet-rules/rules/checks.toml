#:schema https://jouet.jdx.dev/schema/rules.json
[[rule]]
name = "checks"
why = "Records test, lint and build runs and how much each covered, so jouet can stop an agent finishing while one failed, or after it changed files with no test run passing since."
scope = "builtin"
author = "builtin"
created = "2026-10-30"
on = "post-tool-use"
script = "checks.luau"

# The programs the script knows, so any other command is left alone
# without starting the script.
[rule.match]
command = [
  "cargo", "mbx", "cross", "mise", "npm", "pnpm", "yarn", "bun", "aube",
  "make", "just", "task", "go", "hk", "pytest", "vitest", "jest", "bats", "playwright",
  "npx", "bunx", "rspec", "python", "python3", "ruff", "eslint", "mypy", "shellcheck",
  "actionlint", "tsc", "dotnet", "swift", "gradle", "gradlew", "mvn",
  "jouet",
]

[rule.examples]
fires = [
  { command = "cargo test --all-targets", exit_code = 101, kind = "test" },
  { command = "cd crate && cargo test", exit_code = 101, kind = "test" },
  { command = "export PATH=\"$HOME/.cargo/bin:$PATH\" && jouet test --cmd -- cargo +stable test --workspace -j2", exit_code = 1, kind = "test", scope = "full" },
  { command = "cargo +1.91 check --locked", exit_code = 0, kind = "build" },
  { command = "cargo clippy -- -D warnings", exit_code = 101, kind = "lint" },
  { command = "cargo fmt --check", exit_code = 1, kind = "lint" },
  { command = "ruff check .", exit_code = 1, kind = "lint", scope = "full" },
  { command = "ruff --isolated --color never check .", exit_code = 1, kind = "lint", scope = "full" },
  { command = "ruff --config check check -- --diff", exit_code = 1, kind = "lint" },
  { command = "ruff check --fix src/a.py", exit_code = 0, kind = "lint" },
  { command = "ruff check -- --diff", exit_code = 1, kind = "lint" },
  { command = "mise run test:e2e edit", exit_code = 0, kind = "test" },
  { command = "mise run lint", exit_code = 1, kind = "lint" },
  { command = "npm run build", exit_code = 0, kind = "build" },
  { command = "pnpm test", exit_code = 0, kind = "test" },
  { command = "pnpm vitest run a.test.ts", exit_code = 1, kind = "test", scope = "partial @jouet:pnpm:dir=.:vitest a.test.ts", node_scripts = ["test"] },
  { command = "pnpm vitest run --config=unit.ts", exit_code = 1, kind = "test", scope = "partial @jouet:pnpm:dir=.:vitest --config=unit.ts", node_scripts = [] },
  { command = "cd child && pnpm vitest run a.test.ts", exit_code = 1, kind = "test", scope = "partial @jouet:cwd=.:cd=child @jouet:pnpm:dir=.:vitest a.test.ts", node_scripts = [] },
  { command = "python3 -m pytest -x", exit_code = 1, kind = "test" },
  { command = "playwright test e2e/account.spec.ts", exit_code = 1, kind = "test", scope = "partial @jouet:playwright e2e/account.spec.ts" },
  { command = "npx playwright test", exit_code = 0, kind = "test", scope = "partial @jouet:playwright" },
  { command = "npx jest tests/example.test.js", exit_code = 0, kind = "test", scope = "partial @jouet:npx:jest tests/example.test.js" },
  { command = "cd web && npx jest tests/example.test.js", exit_code = 1, kind = "test", scope = "partial @jouet:cwd=.:cd=web @jouet:npx:jest tests/example.test.js" },
  { command = "jouet test --cmd -- npx --no-install jest --runInBand tests/example.test.js", exit_code = 0, kind = "test", scope = "partial @jouet:npx:jest --runInBand tests/example.test.js" },
  { command = "npx --no-install playwright test account.spec.ts", exit_code = 1, kind = "test", scope = "partial @jouet:playwright account.spec.ts" },
  { command = "bunx playwright test", exit_code = 0, kind = "test", scope = "partial @jouet:playwright" },
  { command = "pnpm exec playwright test", exit_code = 0, kind = "test", scope = "partial @jouet:playwright" },
  { command = "yarn exec playwright test", exit_code = 0, kind = "test", scope = "partial @jouet:playwright" },
  { command = "npm exec -- playwright test", exit_code = 0, kind = "test", scope = "partial @jouet:playwright" },
  { command = "yarn workspace web exec playwright test", exit_code = 0, kind = "test", scope = "partial @jouet:playwright:workspace=web" },
  { command = "npx playwright test --config=other.config.ts", exit_code = 0, kind = "test", scope = "partial @jouet:playwright:config --config=other.config.ts" },
  { command = "jouet test --cmd -- npx playwright test", exit_code = 0, kind = "test", scope = "partial @jouet:playwright" },
  { command = "jouet test --cmd -- playwright test", exit_code = 1, kind = "test", scope = "partial @jouet:playwright" },
  { command = "playwright test --only-changed", exit_code = 0, kind = "test", scope = "partial @jouet:playwright --only-changed" },
  { command = "playwright test --grep-invert=slow", exit_code = 0, kind = "test", scope = "partial @jouet:playwright --grep-invert=slow" },
  { command = "playwright test --update-snapshots", exit_code = 0, kind = "test", scope = "partial @jouet:playwright --update-snapshots" },
  { command = "playwright test --test-list=selected.txt", exit_code = 0, kind = "test", scope = "partial @jouet:playwright --test-list=selected.txt" },
  { command = "playwright test --no-deps", exit_code = 0, kind = "test", scope = "partial @jouet:playwright --no-deps" },
  { command = "playwright test --ignore-snapshots", exit_code = 0, kind = "test", scope = "partial @jouet:playwright --ignore-snapshots" },
  { command = "go vet ./...", exit_code = 0, kind = "lint" },
  { command = "make check", exit_code = 0, kind = "lint" },
  { command = "set -o pipefail; cargo test | tee log", exit_code = 101, kind = "test" },
  # How much each run covered.
  { command = "cargo test --workspace", exit_code = 101, kind = "test", scope = "full" },
  { command = "cargo nextest run --workspace --no-fail-fast", exit_code = 0, kind = "test", scope = "full" },
  { command = "cargo clippy --workspace --all-targets -- -D warnings", exit_code = 0, kind = "lint", scope = "full" },
  { command = "cargo test -p jouet-rules --lib", exit_code = 0, kind = "test", scope = "partial -p jouet-rules --lib" },
  { command = "cargo test -pjouet", exit_code = 0, kind = "test", scope = "partial -p jouet" },
  { command = "cargo test --workspace wait_github", exit_code = 0, kind = "test", scope = "partial wait_github" },
  { command = "cargo test --workspace -- --exact verify::tests", exit_code = 0, kind = "test", scope = "partial --exact verify::tests" },
  { command = "cargo test --workspace --test cli", exit_code = 0, kind = "test", scope = "partial --test cli" },
  { command = "cargo nextest run --workspace -E 'test(conflict)'", exit_code = 0, kind = "test", scope = "partial -E test(conflict)" },
  { command = "cargo test --workspace -- --test-threads 1", exit_code = 0, kind = "test", scope = "full" },
  # After a `cd`, a run counts for the work tree it went to.
  { command = "cd ~/elsewhere && cargo test --workspace", exit_code = 0, kind = "test", scope = "full" },
  { command = "cd \"$HOME/src/app\" && jouet test --cmd -- cargo test -q --workspace", exit_code = 0, kind = "test", scope = "full" },
  { command = "mise run test", exit_code = 0, kind = "test", scope = "full" },
  { command = "mise run test:e2e edit", exit_code = 0, kind = "test", scope = "partial test:e2e edit" },
  { command = "npm test", exit_code = 0, kind = "test", scope = "full" },
  { command = "go test ./...", exit_code = 0, kind = "test", scope = "full" },
  { command = "go test ./pkg -run TestWait", exit_code = 0, kind = "test", scope = "partial ./pkg -run TestWait" },
  # One command in a `sh -c` script, its environment set there, passing or
  # failing, with a `$(...)` in its words or not.
  { command = "jouet test --cmd -- sh -c 'cargo test -p $(echo a)'", exit_code = 101, kind = "test" },
  { command = "jouet test --cmd -- mise exec -- sh -c 'PATH=/b E2E=1 go test -tags=e2e ./e2e'", exit_code = 0, kind = "test", scope = "partial ./e2e" },
  # A script of several commands that passed ran each of its checks, as the
  # same commands run directly do.
  { command = "jouet test --cmd -- bash -c 'cargo test -p mise --lib -- miserc && mise run lint'", exit_code = 0, kind = "test", scope = "partial -p mise --lib miserc" },
  # A `cd` in `$(...)` moves only its subshell.
  { command = "jouet test --cmd -- sh -c 'cargo build && cargo test -p $(cd .. && echo a)'", exit_code = 0, kind = "build" },
  { command = "pytest -x -n 4", exit_code = 0, kind = "test", scope = "full" },
  { command = "pytest tests/test_a.py -k slow", exit_code = 0, kind = "test", scope = "partial tests/test_a.py -k slow" },
  { command = "vitest run --exclude=tests/b.test.ts", exit_code = 0, kind = "test", scope = "partial --exclude=tests/b.test.ts" },
  { command = "jouet test --cmd -- vitest run --exclude tests/b.test.ts", exit_code = 0, kind = "test", scope = "partial --exclude tests/b.test.ts" },
  { command = "pnpm exec vitest run", exit_code = 1, kind = "test", scope = "partial @jouet:pnpm:dir=.:vitest" },
  { command = "pnpm --dir web test", exit_code = 1, kind = "test", scope = "partial @jouet:pnpm:dir=web:test" },
  { command = "cd service && pnpm --dir web test", exit_code = 1, kind = "test", scope = "partial @jouet:cwd=.:cd=service @jouet:pnpm:dir=web:test" },
  { command = "cd admin && pnpm test", exit_code = 0, kind = "test", scope = "partial @jouet:cwd=.:cd=admin @jouet:pnpm:dir=.:test" },
  { command = "cd admin && pnpm run test", exit_code = 0, kind = "test", scope = "partial @jouet:cwd=.:cd=admin @jouet:pnpm:dir=.:test" },
  { command = "cd 'service app' && pnpm --dir web test", exit_code = 1, kind = "test", scope = "partial @jouet:cwd=.:cd=service%20app @jouet:pnpm:dir=web:test" },
  { command = "jouet test --cmd -- env TZ=UTC pnpm --dir web exec vitest run --exclude tests/b.test.ts", exit_code = 0, kind = "test", scope = "partial @jouet:pnpm:dir=web:vitest --exclude tests/b.test.ts" },
  { command = "pnpm --dir=web exec vitest run tests/a.test.ts", exit_code = 1, kind = "test", scope = "partial @jouet:pnpm:dir=web:vitest tests/a.test.ts" },
  { command = "pnpm -C web exec vitest run --config=integration.ts", exit_code = 0, kind = "test", scope = "partial @jouet:pnpm:dir=web:vitest --config=integration.ts" },
  { command = "vitest run -c other.config.ts", exit_code = 0, kind = "test", scope = "partial -c other.config.ts" },
  { command = "pnpm --dir web exec vitest run --typecheck.only tests/b.test.ts", exit_code = 0, kind = "test", scope = "partial @jouet:pnpm:dir=web:vitest --typecheck.only tests/b.test.ts" },
  { command = "pnpm --dir web exec vitest typecheck", exit_code = 1, kind = "test", scope = "partial @jouet:pnpm:dir=web:vitest:typecheck" },
  { command = "pnpm --dir web exec vitest bench tests/b.bench.ts", exit_code = 1, kind = "test", scope = "partial @jouet:pnpm:dir=web:vitest:bench tests/b.bench.ts" },
  { command = "pnpm --dir web exec vitest watch", exit_code = 1, kind = "test", scope = "partial @jouet:pnpm:dir=web:vitest:watch" },
  { command = "pnpm --dir web exec vitest dev", exit_code = 1, kind = "test", scope = "partial @jouet:pnpm:dir=web:vitest:dev" },
  { command = "pnpm --dir web exec vitest run --root=other", exit_code = 0, kind = "test", scope = "partial @jouet:pnpm:dir=web:vitest --root=other" },
  { command = "pnpm --dir web exec vitest run --unknown-switch", exit_code = 0, kind = "test", scope = "partial @jouet:pnpm:dir=web:vitest --unknown-switch" },
  { command = "dotnet test -c Release", exit_code = 0, kind = "test", scope = "full" },
  { command = "swift test -c Release", exit_code = 0, kind = "test", scope = "full" },
  { command = "hk check --all", exit_code = 0, kind = "lint", scope = "full" },
  { command = "hk check", exit_code = 1, kind = "lint", scope = "partial changed files" },
  { command = "hk run check --all", exit_code = 0, kind = "lint", scope = "full" },
  { command = "hk check src/a.rs", exit_code = 0, kind = "lint", scope = "partial files src/a.rs" },
  { command = "hk check --all --step eslint", exit_code = 0, kind = "lint", scope = "partial --step eslint" },
  { command = "hk check --staged", exit_code = 0, kind = "lint", scope = "partial --staged" },
  { command = "git diff --name-only -z | hk run check --safe --files0-from -", exit_code = 0, kind = "lint", scope = "partial" },
  { command = "hk run check --safe --format json --files0-from changed.lst", exit_code = 0, kind = "lint", scope = "partial files0-from changed.lst" },
  { command = "hk check --files0-from=/tmp/list --step eslint", exit_code = 0, kind = "lint", scope = "partial files0-from /tmp/list --step eslint" },
  { command = "jouet diag check --changed", exit_code = 1, kind = "lint", scope = "partial changed files" },
  { command = "jouet --json diag check src/a.rs --max 5", exit_code = 1, kind = "lint", scope = "partial files src/a.rs" },
  { command = "bats test/edit.bats", exit_code = 0, kind = "test", scope = "partial" },
  # `jouet test` is the full suite; `--affected` runs part of it.
  { command = "jouet test", exit_code = 1, kind = "test", scope = "full" },
  { command = "jouet --json test", exit_code = 0, kind = "test", scope = "full" },
  { command = "jouet test --affected", exit_code = 0, kind = "test", scope = "partial --affected" },
  { command = "jouet test --affected --since origin/main --json", exit_code = 1, kind = "test", scope = "partial --affected --since origin/main" },
  { command = "jouet test --baseline --affected --since origin/main", exit_code = 0, kind = "test", scope = "partial --affected --since origin/main" },
  # `--baseline` reruns failures at the merge base; the run is still the whole suite.
  { command = "jouet test --baseline", exit_code = 0, kind = "test", scope = "full" },
  { command = "jouet test --baseline --since origin/main", exit_code = 1, kind = "test", scope = "full" },
  { command = "jouet test -- -k slow", exit_code = 0, kind = "test", scope = "partial -- -k slow" },
  # `jouet test --cmd -- CMD` is a run of CMD.
  { command = "jouet test --cmd -- cargo build", exit_code = 1, kind = "build" },
  { command = "jouet test --cmd -- cargo test --workspace", exit_code = 0, kind = "test", scope = "full" },
  { command = "jouet test --cmd -- mise run test:e2e", exit_code = 1, kind = "test", scope = "partial test:e2e" },
  { command = "jouet test --cmd -- python3 -m unittest", exit_code = 0, kind = "test", scope = "full" },
  # The command after --cmd is read through its wrappers, as any command is.
  { command = "jouet test --cmd -- mise x -- cargo test --workspace", exit_code = 0, kind = "test", scope = "full" },
  { command = "jouet test --cmd -- env RUST_LOG=1 cargo test -p jouet-edit", exit_code = 1, kind = "test", scope = "partial -p jouet-edit" },
  { command = "jouet test --cmd -- timeout 600 cargo build", exit_code = 0, kind = "build" },
  # `python -m unittest` runs every test it finds, unless tests are named.
  { command = "python3 -m unittest", exit_code = 0, kind = "test", scope = "full" },
  { command = "python -m unittest -v", exit_code = 1, kind = "test", scope = "full" },
  { command = "python3 -m unittest discover -s tests -v", exit_code = 0, kind = "test", scope = "full" },
  { command = "python3 -m unittest discover -s tests -p 'test_amounts*.py'", exit_code = 0, kind = "test", scope = "partial -p test_amounts*.py" },
  { command = "python3 -m unittest discover tests 'test_a*.py'", exit_code = 0, kind = "test", scope = "partial test_a*.py" },
  { command = "python3 -m unittest tests.test_amounts", exit_code = 1, kind = "test", scope = "partial tests.test_amounts" },
  { command = "python3 -m unittest -k thousands", exit_code = 0, kind = "test", scope = "partial -k thousands" },
  { command = "python3 -m tornado.test.runtests", exit_code = 0, kind = "test", scope = "partial" },
  { command = "jouet test --cmd -- python3 -m tornado.test.runtests tornado.test.web_test", exit_code = 1, kind = "test", scope = "partial" },
]
quiet = [
  { command = "npx jest --listTests", exit_code = 0 },
  { command = "npx jest --updateSnapshot=true", exit_code = 0 },
  { command = "npx jest --update-snapshot", exit_code = 0 },
  { command = "npx jest -u=true", exit_code = 0 },
  { command = "npx jest -t 'two words'", exit_code = 0 },
  { command = "npx --package other jest", exit_code = 0 },
  # Ruff's fix preview and fix-only modes do not report a complete check.
  { command = "ruff check --diff src/a.py", exit_code = 1 },
  { command = "ruff --isolated --color=never check --diff src/a.py", exit_code = 1 },
  { command = "jouet test --cmd -- ruff --config check check --fix-only src/a.py", exit_code = 0 },
  { command = "ruff check --fix --diff src/a.py", exit_code = 1 },
  { command = "ruff check --fix-only src/a.py", exit_code = 0 },
  { command = "jouet test --cmd -- ruff check --diff src/a.py", exit_code = 1 },
  { command = "jouet test --cmd -- ruff check --fix-only src/a.py", exit_code = 0 },
  { command = "pnpm vitest run a.test.ts", exit_code = 1, node_scripts = ["vitest"] },
  { command = "cd child && pnpm vitest run a.test.ts", exit_code = 1, node_scripts = ["vitest"] },
  { command = "pnpm vitest run --help", exit_code = 0, node_scripts = [] },
  # The verifier cannot safely compare dynamic directories or multiword selectors.
  { command = "pnpm --dir \"$PROJECT\" test", exit_code = 1 },
  { command = "pnpm --dir web exec vitest run -t 'some name'", exit_code = 1 },
  { command = "cargo fmt", exit_code = 0 },
  { command = "hk fix", exit_code = 0 },
  { command = "hk run fix --all", exit_code = 0 },
  { command = "jouet diag fix --changed", exit_code = 0 },
  { command = "jouet diag delta src/a.rs", exit_code = 0 },
  { command = "jouet diag check --help", exit_code = 0 },
  { command = "hk check --help", exit_code = 0 },
  { command = "hk check --plan", exit_code = 0 },
  { command = "jouet edit replace a.rs --old a --new b", exit_code = 0 },
  { command = "mise run lint-fix", exit_code = 0 },
  { command = "cargo run", exit_code = 0 },
  { command = "npm install", exit_code = 0 },
  { command = "cargo test; echo done", exit_code = 1 },
  # Without pipefail, a pipeline's 0 is its last command's, not the tests'.
  { command = "cargo test 2>&1 | tail -5", exit_code = 0 },
  { command = "jouet test --cmd -- cargo test --workspace 2>&1 | head -3", exit_code = 0 },
  { command = "cargo test || true", exit_code = 0 },
  { command = "cargo test &", exit_code = 0 },
  # A `cd` the rule cannot follow leaves the work tree unknown.
  { command = "cd \"$DIR\" && cargo test --workspace", exit_code = 0 },
  { command = "cd - && cargo test --workspace", exit_code = 0 },
  # Nothing ran: listing or explaining the tests, a dry run, a usage error,
  # no runner found, another command.
  { command = "pytest --collect-only -q", exit_code = 0 },
  { command = "playwright test --list", exit_code = 0 },
  { command = "playwright install chromium", exit_code = 0 },
  { command = "playwright test --ui", exit_code = 0 },
  { command = "playwright test --ui-host=localhost", exit_code = 0 },
  { command = "playwright test --debug", exit_code = 0 },
  { command = "playwright test --pass-with-no-tests", exit_code = 0 },
  { command = "playwright test --only-changed --ui", exit_code = 0 },
  { command = "npx playwright test --no-deps --debug", exit_code = 0 },
  { command = "yarn workspace web run playwright test", exit_code = 0 },
  { command = "npx --package other playwright test", exit_code = 0 },
  { command = "python3 -m tornado.test.runtests --help", exit_code = 0 },
  { command = "python3 -m tornado.test.other", exit_code = 0 },
  { command = "cargo test -- --list", exit_code = 0 },
  { command = "jouet test --cmd -- python3 -m pytest --co", exit_code = 0 },
  { command = "cargo test --help", exit_code = 0 },
  { command = "jouet test --affected --dry-run", exit_code = 0 },
  { command = "jouet test --since main", exit_code = 2 },
  { command = "jouet test --affected", exit_code = 4 },
  { command = "jouet test --cmd -- cargo test", exit_code = 4 },
  # A command the rule does not know is recorded as nothing, as when run
  # directly.
  { command = "jouet test --budget 2000 --cmd -- ./run-tests.sh", exit_code = 0 },
  { command = "./run-tests.sh", exit_code = 0 },
  # A script that failed says nothing of which of its commands did, and
  # one that changes directory ran its checks in a work tree the rule
  # cannot name.
  { command = "jouet test --cmd -- sh -c 'cargo build && cargo test'", exit_code = 101 },
  { command = "jouet test --cmd -- sh -c 'cd sub && cargo build && cargo test'", exit_code = 0 },
  { command = "jouet test --cmd -- env -C ../other sh -c 'cargo build && cargo test'", exit_code = 0 },
  { command = "jouet test --cmd -- env -C../other sh -c 'cargo build && cargo test'", exit_code = 0 },
  # A command that is not a check may change the files after the checks
  # ran.
  { command = "jouet test --cmd -- sh -c 'go test ./a && rm -rf out'", exit_code = 0 },
  # `!` turns a failing test run into a script that exits 0.
  { command = "jouet test --cmd -- sh -c '! cargo test --workspace'", exit_code = 0 },
  { command = "jouet test --cmd -- sh -c 'cargo test --workspace | tail'", exit_code = 0 },
  { command = "jouet test --cmd -- sh -c '! cargo test --workspace && cargo build'", exit_code = 0 },
  { command = "jouet test --cmd -- sh -c \"cargo test --workspace && sed -i s/a/b/ src/lib.rs\"", exit_code = 0 },
  # `diag check` refused (no hk config) or misused: no lint ran.
  { command = "jouet diag check wordcount.py", exit_code = 4 },
  { command = "jouet --json diag check --changed", exit_code = 4 },
  { command = "jouet diag check --bogus", exit_code = 2 },
  { command = "jouet pr status", exit_code = 0 },
  # Not a program the script knows: it does not run.
  { command = "ls -la src", exit_code = 0 },
]
