#:schema https://jouet.jdx.dev/schema/rules.json
[[rule]]
name = "secret-files"
why = "Reading a plaintext secrets or credentials file puts every value in it in the transcript, which leaves the machine with every turn and outlives the session."
mode = "deny"
scope = "builtin"
author = "builtin"
created = "2026-10-31"
suggest = "fnox exec -- <command>"
message = "In a project that uses fnox, `.env` files and the files fnox's plain providers read hold real secret values, and so do credential files in the home directory such as `~/.npmrc`, `~/.netrc` and `~/.aws/credentials`; this call would print them into the transcript. `fnox exec` hands a command a project's secrets as environment variables, and `fnox list` shows their names; a credential file is read by the tool it belongs to, and `ls` shows whether it exists."

# `.env` and `.env.local`, but not `.env.example` and its kin, which hold
# placeholders.
[[rule.match]]
fnox = true
tool = "Read"
paths = [".env", ".env.*"]
unless_paths = ["*.example", "*.sample", "*.template", "*.dist"]

# `.env` itself, then its variants. An example file beside a variant, as
# in `cat .env.example .env.local`, leaves the call alone: arguments are
# excluded per call, not per file.
[[rule.match]]
fnox = true
command = [
  "cat", "head", "tail", "less", "more", "bat", "nl", "tac", "grep", "rg",
  "awk", "cut", "sort", "uniq", "strings", "xxd", "od", "hexdump", "base64",
]
args = [".env", "*/.env"]

[[rule.match]]
fnox = true
command = [
  "cat", "head", "tail", "less", "more", "bat", "nl", "tac", "grep", "rg",
  "awk", "cut", "sort", "uniq", "strings", "xxd", "od", "hexdump", "base64",
]
args = [".env.*", "*/.env.*"]
unless_args = ["*.example", "*.sample", "*.template", "*.dist"]

# `sed -i` edits the file without printing it.
[[rule.match]]
fnox = true
command = "sed"
args = [".env", ".env.*", "*/.env", "*/.env.*"]
unless_args = ["*.example", "*.sample", "*.template", "*.dist"]
unless_flags = ["-i", "--in-place"]

# The files a fnox `plain` provider reads secrets from, whatever their name.
[[rule.match]]
tool = "Read"
secret_files = true

[[rule.match]]
command = [
  "cat", "head", "tail", "less", "more", "bat", "nl", "tac", "grep", "rg",
  "awk", "cut", "sort", "uniq", "strings", "xxd", "od", "hexdump", "base64",
  "sed",
]
secret_files = true
unless_flags = ["--in-place"]

# Credential files in the home directory hold tokens for npm, PyPI, git
# hosts, Docker registries, gh, cargo, RubyGems, AWS and Kubernetes, in any
# project. Only the home directory's: a project's own `.npmrc` usually holds
# registry settings an agent needs to read. Commands name them through `~`
# or `$HOME`; the Read tool gets the absolute path.
[[rule.match]]
command = [
  "cat", "head", "tail", "less", "more", "bat", "nl", "tac", "grep", "rg",
  "awk", "cut", "sort", "uniq", "strings", "xxd", "od", "hexdump", "base64",
  "jq", "yq",
]
args = [
  "~/.npmrc", "$HOME/.npmrc", "${HOME}/.npmrc", "~/.pypirc", "$HOME/.pypirc",
  "${HOME}/.pypirc", "~/.netrc", "$HOME/.netrc", "${HOME}/.netrc",
  "~/.git-credentials", "$HOME/.git-credentials", "${HOME}/.git-credentials",
  "~/.docker/config.json", "$HOME/.docker/config.json",
  "${HOME}/.docker/config.json", "~/.config/gh/hosts.yml",
  "$HOME/.config/gh/hosts.yml", "${HOME}/.config/gh/hosts.yml",
  "~/.cargo/credentials.toml", "$HOME/.cargo/credentials.toml",
  "${HOME}/.cargo/credentials.toml", "~/.cargo/credentials",
  "$HOME/.cargo/credentials", "${HOME}/.cargo/credentials",
  "~/.gem/credentials", "$HOME/.gem/credentials", "${HOME}/.gem/credentials",
  "~/.aws/credentials", "$HOME/.aws/credentials", "${HOME}/.aws/credentials",
  "~/.kube/config", "$HOME/.kube/config", "${HOME}/.kube/config",
]

# `sed -i` edits the file without printing it; `-i` means that only to sed.
[[rule.match]]
command = "sed"
args = [
  "~/.npmrc", "$HOME/.npmrc", "${HOME}/.npmrc", "~/.pypirc", "$HOME/.pypirc",
  "${HOME}/.pypirc", "~/.netrc", "$HOME/.netrc", "${HOME}/.netrc",
  "~/.git-credentials", "$HOME/.git-credentials", "${HOME}/.git-credentials",
  "~/.docker/config.json", "$HOME/.docker/config.json",
  "${HOME}/.docker/config.json", "~/.config/gh/hosts.yml",
  "$HOME/.config/gh/hosts.yml", "${HOME}/.config/gh/hosts.yml",
  "~/.cargo/credentials.toml", "$HOME/.cargo/credentials.toml",
  "${HOME}/.cargo/credentials.toml", "~/.cargo/credentials",
  "$HOME/.cargo/credentials", "${HOME}/.cargo/credentials",
  "~/.gem/credentials", "$HOME/.gem/credentials", "${HOME}/.gem/credentials",
  "~/.aws/credentials", "$HOME/.aws/credentials", "${HOME}/.aws/credentials",
  "~/.kube/config", "$HOME/.kube/config", "${HOME}/.kube/config",
]
unless_flags = ["-i", "--in-place"]

[[rule.match]]
tool = "Read"
paths = [
  "/home/*/.npmrc", "/Users/*/.npmrc", "/root/.npmrc", "/home/*/.pypirc",
  "/Users/*/.pypirc", "/root/.pypirc", "/home/*/.netrc", "/Users/*/.netrc",
  "/root/.netrc", "/home/*/.git-credentials", "/Users/*/.git-credentials",
  "/root/.git-credentials", "/home/*/.docker/config.json",
  "/Users/*/.docker/config.json", "/root/.docker/config.json",
  "/home/*/.config/gh/hosts.yml", "/Users/*/.config/gh/hosts.yml",
  "/root/.config/gh/hosts.yml", "/home/*/.cargo/credentials.toml",
  "/Users/*/.cargo/credentials.toml", "/root/.cargo/credentials.toml",
  "/home/*/.cargo/credentials", "/Users/*/.cargo/credentials",
  "/root/.cargo/credentials", "/home/*/.gem/credentials",
  "/Users/*/.gem/credentials", "/root/.gem/credentials",
  "/home/*/.aws/credentials", "/Users/*/.aws/credentials",
  "/root/.aws/credentials", "/home/*/.kube/config", "/Users/*/.kube/config",
  "/root/.kube/config",
]

[rule.examples]
fires = [
  { command = "cat .env", fnox = {} },
  { command = "cat .env.local", fnox = {} },
  { command = "cat services/api/.env", fnox = {} },
  { command = "grep DATABASE .env.production", fnox = {} },
  { command = "head -5 .env", fnox = {} },
  { command = "sed -n 1,10p .env", fnox = {} },
  { command = "cat .env.example .env", fnox = {} },
  { tool = "Read", path = ".env", fnox = {} },
  { tool = "Read", path = "/repo/.env.local", fnox = {} },
  { command = "cat secrets.env", fnox = { files = ["secrets.env"] } },
  { command = "cat ./config/../secrets.env", fnox = { files = ["secrets.env"] } },
  { tool = "Read", path = "creds.yaml", fnox = { files = ["creds.yaml"] } },
  { command = "rtk cat .env", fnox = {} },
  "cat ~/.npmrc",
  "grep _authToken $HOME/.npmrc",
  "grep -i token ~/.npmrc",
  "sort -i ~/.netrc",
  "cat \"${HOME}/.netrc\"",
  "jq . ~/.docker/config.json",
  "head ~/.aws/credentials",
  "sed -n 1,5p ~/.config/gh/hosts.yml",
  { tool = "Read", path = "/home/coder/.npmrc" },
  { tool = "Read", path = "/Users/me/.git-credentials" },
  { tool = "Read", path = "/root/.cargo/credentials.toml" },
]
quiet = [
  # Not a fnox project.
  "cat .env",
  { tool = "Read", path = ".env" },
  # Placeholders, or a file fnox does not read.
  { command = "cat .env.example", fnox = {} },
  { command = "cat .env.sample", fnox = {} },
  { tool = "Read", path = ".env.example", fnox = {} },
  { command = "cat README.md", fnox = { files = ["secrets.env"] } },
  { command = "cat environment.md", fnox = {} },
  # Using or changing the file without printing it.
  { command = "sed -i 's/^DEBUG=.*/DEBUG=1/' .env", fnox = {} },
  { command = "source .env && npm test", fnox = {} },
  { command = "fnox import .env", fnox = {} },
  { command = "ls -la .env", fnox = {} },
  { command = "echo '.env' >> .gitignore", fnox = {} },
  # A project's own registry settings, or a credential file used, not read.
  "cat .npmrc",
  "cat web/.npmrc",
  { tool = "Read", path = "/home/coder/src/app/.npmrc" },
  "ls -la ~/.npmrc",
  "npm whoami",
  "sed -i '/registry/d' ~/.npmrc",
]
