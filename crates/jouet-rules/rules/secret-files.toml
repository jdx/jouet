#:schema https://jouet.jdx.dev/schema/rules.json
[[rule]]
name = "secret-files"
why = "Reading a plaintext secrets file puts every value in it in the transcript, which leaves the machine with every turn and outlives the session."
mode = "deny"
scope = "builtin"
author = "builtin"
created = "2026-10-31"
suggest = "fnox exec -- <command>"
message = "In a project that uses fnox, `.env` files and the files fnox's plain providers read hold real secret values, and this call would print them into the transcript. `fnox exec` hands a command those secrets as environment variables; `fnox list` shows their names."

# `.env` and `.env.local`, but not `.env.example` and its kin, which hold
# placeholders.
[[rule.match]]
fnox = true
tool = "Read"
paths = [".env", ".env.*"]
unless_paths = ["*.example", "*.sample", "*.template", "*.dist"]

# `.env` itself, then its variants. An example file beside a variant, as
# in `cat .env.example .env.local`, leaves the call alone: arguments are
# excluded per call, not per file.
[[rule.match]]
fnox = true
command = [
  "cat", "head", "tail", "less", "more", "bat", "nl", "tac", "grep", "rg",
  "awk", "cut", "sort", "uniq", "strings", "xxd", "od", "hexdump", "base64",
]
args = [".env", "*/.env"]

[[rule.match]]
fnox = true
command = [
  "cat", "head", "tail", "less", "more", "bat", "nl", "tac", "grep", "rg",
  "awk", "cut", "sort", "uniq", "strings", "xxd", "od", "hexdump", "base64",
]
args = [".env.*", "*/.env.*"]
unless_args = ["*.example", "*.sample", "*.template", "*.dist"]

# `sed -i` edits the file without printing it.
[[rule.match]]
fnox = true
command = "sed"
args = [".env", ".env.*", "*/.env", "*/.env.*"]
unless_args = ["*.example", "*.sample", "*.template", "*.dist"]
unless_flags = ["-i", "--in-place"]

# The files a fnox `plain` provider reads secrets from, whatever their name.
[[rule.match]]
tool = "Read"
secret_files = true

[[rule.match]]
command = [
  "cat", "head", "tail", "less", "more", "bat", "nl", "tac", "grep", "rg",
  "awk", "cut", "sort", "uniq", "strings", "xxd", "od", "hexdump", "base64",
  "sed",
]
secret_files = true
unless_flags = ["--in-place"]

[rule.examples]
fires = [
  { command = "cat .env", fnox = {} },
  { command = "cat .env.local", fnox = {} },
  { command = "cat services/api/.env", fnox = {} },
  { command = "grep DATABASE .env.production", fnox = {} },
  { command = "head -5 .env", fnox = {} },
  { command = "sed -n 1,10p .env", fnox = {} },
  { command = "cat .env.example .env", fnox = {} },
  { tool = "Read", path = ".env", fnox = {} },
  { tool = "Read", path = "/repo/.env.local", fnox = {} },
  { command = "cat secrets.env", fnox = { files = ["secrets.env"] } },
  { command = "cat ./config/../secrets.env", fnox = { files = ["secrets.env"] } },
  { tool = "Read", path = "creds.yaml", fnox = { files = ["creds.yaml"] } },
  { command = "rtk cat .env", fnox = {} },
]
quiet = [
  # Not a fnox project.
  "cat .env",
  { tool = "Read", path = ".env" },
  # Placeholders, or a file fnox does not read.
  { command = "cat .env.example", fnox = {} },
  { command = "cat .env.sample", fnox = {} },
  { tool = "Read", path = ".env.example", fnox = {} },
  { command = "cat README.md", fnox = { files = ["secrets.env"] } },
  { command = "cat environment.md", fnox = {} },
  # Using or changing the file without printing it.
  { command = "sed -i 's/^DEBUG=.*/DEBUG=1/' .env", fnox = {} },
  { command = "source .env && npm test", fnox = {} },
  { command = "fnox import .env", fnox = {} },
  { command = "ls -la .env", fnox = {} },
  { command = "echo '.env' >> .gitignore", fnox = {} },
]
