#:schema https://jouet.jdx.dev/schema/rules.json
[[rule]]
name = "piped-test-output"
why = "Cutting a test or build run's output with head, tail or grep often drops the failure that mattered, and the whole run is repeated with another filter; `jouet test --cmd` keeps all of it in a log and prints each failure within a budget. It warns the first time in a session and denies after that, since a warning alone was followed once and then forgotten."
mode = "deny"
# The primer already asks for `jouet test --cmd` for any test or build, and
# the rule warns before it ever denies, so naming it there saves no call.
primer = false
scope = "builtin"
author = "builtin"
created = "2026-10-31"
needs = ["test"]
# The matcher finds a test or build runner in a call that also runs a
# program that cuts output; the script checks that it cuts that run's own
# output, through a pipe or a file the call writes and reads back, and
# denies only once the session was warned (`jouet.session.fired()`).
script = "piped-test-output.luau"

[rule.match]
command = [
  "cargo", "mbx", "cross", "go", "pytest", "python", "python3", "vitest", "jest",
  "npx", "bunx", "bats", "rspec", "tsc", "npm", "pnpm", "yarn", "bun", "mise",
  "make", "just", "task", "dotnet", "gradle", "gradlew", "mvn", "jouet",
]
with = { command = ["head", "tail", "grep", "egrep", "fgrep", "rg", "sed"] }

[rule.examples]
fires = [
  "cargo build 2>&1 | grep -E '^(error|warning)' -A8 | head -30",
  "cargo build -q 2>&1 | tail -40",
  "cargo test -q -p jouet-rules job_start 2>&1 | grep -E 'test result|panicked' -A4 | head -6",
  "cd ~/src/app && cargo test --workspace --all-targets 2>&1 | grep -E 'FAILED|panicked' | head",
  "cargo nextest run 2>&1 | tee out.log | tail -5",
  "cargo test 2>&1 | tee /tmp/t.log; grep -n panicked /tmp/t.log",
  "test/bats/bin/bats test/pitchfork.bats 2>&1 | grep -vE '^ok' | head -40",
  "timeout 900 mise run test > /tmp/test.log 2>&1; grep -E 'not ok|FAILED' /tmp/test.log",
  "mise run test:e2e > $S/e2e.log 2>&1; tail -30 $S/e2e.log",
  "go test ./internal/sandbox 2>&1 | tail -2",
  "npm test 2>&1 | tail -20",
  "pnpm run build | grep error",
  "python3 -m pytest -x 2>&1 | sed -n '1,40p'",
  "npx vitest run 2>&1 | head -50",
  "make 2>&1 | tail",
  "RUST_LOG=debug cargo test --manifest-path $DIR/Cargo.toml 2>&1 | tail",
  # Inside `jouet test`, it sees only the cut output and the last exit code.
  "jouet test --cmd -- sh -c 'cargo test --bin fnox editor 2>&1 | tail -15; mise run build 2>&1 | tail -3'",
  "jouet test --cmd -- bash -lc 'go test ./... | grep -v ^ok'",
  "jouet test --cmd -- sh -c 'RUST_LOG=debug cargo test 2>&1 | tail'",
  # Warned once already in this session: denied.
  { command = "cargo build -q 2>&1 | tail -5", session = "s1", fired = 0, action = "warn" },
  { command = "cargo build -q 2>&1 | tail -5", session = "s1", fired = 1, action = "deny" },
  { command = "jouet test --cmd -- sh -c 'cargo test | tail'", session = "s1", fired = 2, action = "deny" },
  # `jouet test` itself cut with head or tail: warned once, never denied.
  { command = "jouet test --cmd -- mise run test:e2e test_a 2>&1 | tail -4 && cargo clippy", session = "s1", fired = 0, action = "warn" },
  { command = "cd app && jouet test --affected | head -20", action = "warn" },
  # No session to count in (or no ledger): it only warns.
  { command = "cargo build -q 2>&1 | tail -5", fired = 3, action = "warn" },
  { command = "cargo test | tail", session = "s1", action = "warn" },
]
quiet = [
  # Left to `scoped-lint`.
  "cargo clippy --workspace 2>&1 | head -50",
  "mise run lint 2>&1 | tail",
  # Output kept whole, in a file not read back, or not cut.
  "cargo test > /tmp/test.log 2>&1",
  "cargo test > /tmp/test.log 2>&1; grep -n add src/lib.rs",
  "cargo test 2>&1 | tee out.log",
  "cargo build 2>&1 | wc -l",
  "cargo test 2>&1 | sed 's/^/  /'",
  "cargo test; grep -rn TODO src",
  "sed -n '1,20p' src/lib.rs && cargo test",
  # Not a test or a build, or only asking about one.
  "cargo test --help | head",
  "cargo test -- --list | grep parse",
  "pytest --collect-only -q | tail -3",
  "cargo run --bin demo | head",
  "npm install 2>&1 | tail -3",
  "go vet ./... | head",
  "git log --oneline | head",
  "echo 'cargo test | head'",
  "jouet test --cmd -- cargo test",
  "jouet test --affected --dry-run | grep vitest",
  "jouet test --help | head",
  "jouet test --cmd -- cargo test 2>&1 | tee test.log",
  # `jouet test` cut: it records its own result, and its output is short;
  # a head or tail on it was warned about once already.
  { command = "jouet test --cmd -- mise run test 2>&1 | tail -10", session = "s1", fired = 1 },
  { command = "jouet test --cmd -- cargo test --workspace --all-targets 2>&1 | tail -3 && git push", session = "s1", fired = 2 },
  "jouet --json test --affected | grep -c failed",
  "jouet test > t.log 2>&1; tail -5 t.log",
  "jouet pr status | head -3",
  "jouet test --cmd -- sh -c 'cargo build && cargo test'",
  "jouet test --cmd -- sh -c 'cargo test 2>&1 | tee t.log'",
  # Warned before, but this run is not cut.
  { command = "jouet test --cmd -- cargo build -q", session = "s1", fired = 4 },
]
