[package]
name = "jouet-search"
version = "0.0.1"
description = "Budgeted search with session memory, grouped by definition, behind jouet search"
keywords = ["agents", "search", "tree-sitter", "grep"]
categories = ["development-tools", "text-processing"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
include = ["/src/**", "/LICENSE"]

[lints]
workspace = true

[features]
# The tree-sitter grammars: the definitions search groups matches by.
grammars = [
  "dep:tree-sitter",
  "dep:tree-sitter-c",
  "dep:tree-sitter-cpp",
  "dep:tree-sitter-go",
  "dep:tree-sitter-java",
  "dep:tree-sitter-javascript",
  "dep:tree-sitter-python",
  "dep:tree-sitter-ruby",
  "dep:tree-sitter-rust",
  "dep:tree-sitter-typescript",
]

[dependencies]
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tree-sitter = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
