[package]
name = "jouet-wait"
version = "0.0.2"
description = "The conditions and polling behind jouet wait: local subjects, CI runs and pull requests"
keywords = ["agents", "wait", "ci", "github"]
categories = ["development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# The source and the licence, and nothing a checkout happens to hold.
include = ["/src/**", "/LICENSE"]

[lints]
workspace = true

[dependencies]
jouet-github.workspace = true
jouet-output.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
