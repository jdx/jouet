[package]
name = "jouet-graph"
version = "0.0.1"
description = "The code graph behind jouet graph: symbols, callers, impact and affected tests, derived from codegraph"
keywords = ["agents", "code-graph", "tree-sitter", "sqlite"]
categories = ["development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# The source, the licence and codegraph's notice, and nothing a checkout
# happens to hold.
include = ["/src/**", "/LICENSE", "/NOTICE"]

[lints]
workspace = true

[dependencies]
ignore.workspace = true
jouet-output.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tree-sitter.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-ruby.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true

[dev-dependencies]
tempfile.workspace = true
