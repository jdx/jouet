context = """
jouet is a Rust CLI toolkit for coding agents. It replaces the chores agents rebuild by hand in
shell loops: waiting on CI (`jouet wait`), listing, replying to and resolving PR review threads
(`jouet pr threads`), summarising the state of many PRs at once (`jouet pr status`), and making
exact, all-or-nothing file edits (`jouet edit`). Every command works without a TTY, never
prompts, uses one shared exit-code table, and offers token-lean `--json` output.

jouet is in early development. Commands land one milestone at a time, so a release may be the
first to ship a command at all.
"""

system_extra = """
jouet is pre-v1. Its commands, flags, exit codes and JSON fields are not finalized and may change
incompatibly between releases. Match that. Do not imply production readiness or use marketing
language about what the release unlocks. Describe what changed and why, and call out breaking
changes plainly.
"""

[defaults]
emoji = false
