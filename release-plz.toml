[workspace]
# Label the release PR so it is easy to find and filter.
pr_labels = ["release"]
# Releases happen by merging a release PR (auto-merge-release.yml does that on
# a cadence), not by any push that happens to carry a version bump.
release_always = false
git_tag_enable = true
git_release_enable = true
# Drafted so release.yml can attach binaries before anyone sees it — a release
# that appears without its assets is worse than one that appears a minute
# later. release-plz.yml undrafts it once the upload succeeds.
git_release_draft = true
# A CLI: its promise is its commands, flags, exit codes and JSON output, not a
# Rust API, so cargo-semver-checks has nothing meaningful to read. A real CLI
# break is declared with `!` and a `BREAKING CHANGE:` footer.
semver_check = false

# Every crate shares one version, moved together by `version_group`. The
# libraries exist to build the `jouet` binary and promise nothing on their own,
# so a separate number per crate would say nothing. release-plz publishes them
# in dependency order: jouet-output, then jouet-github, then jouet-edit,
# jouet-wait and jouet-audit, then jouet.
[[package]]
name = "jouet"
publish = true
version_group = "jouet"
# One changelog for the whole tool: a fix that only touches a library crate is
# still a change to the jouet people install.
changelog_include = ["jouet-output", "jouet-github", "jouet-edit", "jouet-wait", "jouet-audit"]
# The tag people reference, and the one release.yml's archives hang off.
git_tag_name = "v{{ version }}"

# The libraries: crates.io is their distribution, and their commits are in
# jouet's changelog. A GitHub release for one would carry no assets, and only
# the `jouet` release is undrafted by release-plz.yml. No tags either, so the
# `v*` tags auto-merge-release.yml and communique read are jouet's alone.
[[package]]
name = "jouet-output"
publish = true
version_group = "jouet"
changelog_update = false
git_tag_enable = false
git_release_enable = false

[[package]]
name = "jouet-github"
publish = true
version_group = "jouet"
changelog_update = false
git_tag_enable = false
git_release_enable = false

[[package]]
name = "jouet-edit"
publish = true
version_group = "jouet"
changelog_update = false
git_tag_enable = false
git_release_enable = false

[[package]]
name = "jouet-wait"
publish = true
version_group = "jouet"
changelog_update = false
git_tag_enable = false
git_release_enable = false

[[package]]
name = "jouet-audit"
publish = true
version_group = "jouet"
changelog_update = false
git_tag_enable = false
git_release_enable = false
